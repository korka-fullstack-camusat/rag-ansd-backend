# Backend seul :  docker compose up --build -d   (dans ce dossier)
# API : http://localhost:8000  —  docs : http://localhost:8000/docs
# Pour lancer backend + frontend ensemble, voir ../../docker-compose.yml
services:
  backend:
    build: .
    container_name: ansd-backend
    env_file:
      - path: .env
        required: false
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - fastembed-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  fastembed-models:
    name: ansd-fastembed-models
