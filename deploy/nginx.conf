# Repartiteur de charge devant les instances du backend (docker-compose.scale.yml).
worker_processes auto;
events { worker_connections 10240; }

http {
  # Resolution DNS Docker : « backend » renvoie toutes les instances.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream backend {
    zone backend 64k;
    least_conn;                       # vers l'instance la moins occupee
    server backend:8000 resolve;
    keepalive 256;
  }

  server {
    listen 8000;
    client_max_body_size 2m;

    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 90s;
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
