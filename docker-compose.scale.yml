# Plusieurs instances du backend derriere un repartiteur de charge Nginx,
# avec Redis partage (cache des reponses + limitation de debit).
#
#   docker compose -f docker-compose.scale.yml up --build -d
#   docker compose -f docker-compose.scale.yml up -d --scale backend=6   # ajuster
#
# L'API reste sur http://localhost:8000 : le frontend n'a rien a changer.
# Ne pas lancer en meme temps que docker-compose.yml (meme port 8000).
services:
  api:
    image: nginx:1.27-alpine
    container_name: ansd-api-lb
    ports:
      - "8000:8000"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      RATE_LIMIT_IP_PER_MINUTE: ${RATE_LIMIT_IP_PER_MINUTE:-600}
      # Seul Nginx joint les instances : on peut lui faire confiance pour l'IP client.
      FORWARDED_ALLOW_IPS: "*"
    deploy:
      replicas: 3
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - fastembed-models:/models
      # Index de recherche rapide partage par les instances (une seule le construit, verrou fichier)
      - fastindex-data:/app/fastindex
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    restart: unless-stopped

volumes:
  fastembed-models:
    name: ansd-fastembed-models
  fastindex-data:
    name: ansd-fastindex
